name: RelayGuard CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Concurrency Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: relayguard
          POSTGRES_USER: relayguard
          POSTGRES_PASSWORD: relayguard_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated test suite
        env:
          DATABASE_URL: postgresql://relayguard:relayguard_dev_password@localhost:5432/relayguard
        run: |
          python -m pytest -v

      - name: Run empirical 100-request measurement
        env:
          DATABASE_URL: postgresql://relayguard:relayguard_dev_password@localhost:5432/relayguard
        run: |
          python -m scripts.measure

      - name: Run live demonstration script
        env:
          DATABASE_URL: postgresql://relayguard:relayguard_dev_password@localhost:5432/relayguard
        run: |
          python -m scripts.demo_live
